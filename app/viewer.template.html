<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>乾隆御製詩 · 全文檢索</title>
<style>
:root{
  --paper:#f6f2e8; --paper-2:#fbf8f1; --card:#fffdf8; --ink:#2a241d; --ink-2:#5b5348;
  --muted:#8d8477; --line:#e2dccd; --line-2:#d3c9b4; --verm:#a8322d; --verm-2:#8d2723;
  --gold:#a9853f; --mark:#ffe8a3; --shadow:0 1px 2px rgba(60,48,30,.06),0 8px 24px rgba(60,48,30,.06);
  --focus:rgba(169,133,63,.55);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --serif:"Songti SC","STSong","Source Han Serif SC","Noto Serif CJK SC","SimSun",Georgia,serif;
}
[data-theme="dark"]{
  --paper:#16151a; --paper-2:#1c1b21; --card:#212027; --ink:#e8e3d8; --ink-2:#b6afa2;
  --muted:#8b8578; --line:#33313a; --line-2:#3d3a44; --verm:#e0796f; --verm-2:#c96a61;
  --gold:#c9a761; --mark:#5c4a1e; --focus:rgba(201,167,97,.6);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.6;
  -webkit-font-smoothing:antialiased;background-image:radial-gradient(circle at 12% 8%,rgba(169,133,63,.05),transparent 45%),radial-gradient(circle at 88% 0%,rgba(168,50,45,.045),transparent 40%)}
a{color:var(--verm);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select{font:inherit;color:inherit}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}

/* 焦点可见性：键盘可达控件高亮，鼠标点击不产生难看的宽环 */
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
button:focus-visible,select:focus-visible,input:focus-visible{border-color:var(--gold);box-shadow:0 0 0 3px var(--focus)}

/* 动效减敏 */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}

/* ---------- top bar ---------- */
header{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--paper) 86%,transparent);
  backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.wrap{max-width:1400px;margin:0 auto;padding:0 18px}
.bar{display:flex;align-items:center;gap:16px;padding:12px 0 8px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.brand h1{margin:0;font-family:var(--serif);font-size:20px;letter-spacing:.12em;font-weight:600}
.brand .seal{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:5px;background:var(--verm);color:#fff;font-family:var(--serif);font-size:15px;line-height:1}
.brand small{color:var(--muted);font-size:12px;letter-spacing:.04em}
.searchbox{flex:1 1 320px;min-width:260px;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line-2);
  border-radius:10px;padding:8px 12px;box-shadow:var(--shadow)}
.searchbox:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px var(--focus)}
.searchbox svg{flex:0 0 auto;opacity:.5}
.searchbox input{flex:1;border:0;background:transparent;outline:0;padding:4px 2px;font-size:16px}
.tools{display:flex;gap:8px;align-items:center;flex:0 0 auto}
.btn{border:1px solid var(--line-2);background:var(--card);border-radius:8px;padding:7px 12px;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:.15s}
.btn:hover{border-color:var(--gold);color:var(--ink)}
.btn.primary{background:var(--verm);border-color:var(--verm);color:#fff}
.btn.primary:hover{background:var(--verm-2)}
.btn.ghost{background:transparent}
.btn.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn .kbd{margin-left:2px}

/* ---------- filters（分组、清晰、可换行） ---------- */
.filters{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:4px 0 12px}
.fgroup{display:flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--line);
  border-radius:9px;padding:4px 8px}
.fgroup > label{color:var(--muted);font-size:12px;white-space:nowrap}
.fgroup select,.fgroup input{border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 6px;outline:0;font-size:13px}
.fgroup select:hover,.fgroup input:hover{border-color:var(--line-2)}
.fgroup select:focus-visible,.fgroup input:focus-visible{border-color:var(--gold)}
.yr{width:64px}
.fspacer{flex:1 1 auto}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px dashed var(--line-2);background:transparent;border-radius:20px;padding:4px 12px;font-size:12px;cursor:pointer;color:var(--ink-2);transition:.12s}
.chip:hover,.chip.on{border-style:solid;border-color:var(--verm);color:var(--verm)}
.hint{color:var(--muted);font-size:12px}
.faction{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- layout ---------- */
main{display:grid;grid-template-columns:minmax(360px,440px) 1fr;gap:18px;align-items:start;padding:18px 0 60px}
@media(max-width:1040px){main{grid-template-columns:1fr}.detail{position:static!important}.panel-list .list{height:56vh}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.listhead{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line);
  position:sticky;top:64px;background:var(--card);border-radius:14px 14px 0 0;z-index:5}
.count{font-size:13px;color:var(--muted)}
.count b{color:var(--ink);font-size:15px}

/* 固定行高窗口化列表 */
.list{overflow:auto;position:relative;will-change:transform}
.list.virtual{height:calc(100vh - 216px)}
.vpad{position:relative;width:100%}
.vwin{position:absolute;top:0;left:0;right:0}
.item{padding:11px 12px;border-radius:10px;cursor:pointer;border:1px solid transparent;transition:.12s;height:118px;overflow:hidden}
.item:hover{background:var(--paper-2);border-color:var(--line)}
.item.on{background:var(--paper-2);border-color:var(--gold)}
.item.on:focus-visible{box-shadow:0 0 0 3px var(--focus)}
.item .t{font-family:var(--serif);font-size:15.5px;font-weight:600;letter-spacing:.02em;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{color:var(--ink-2);font-size:12.5px;line-height:1.55;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .m{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 6px;background:var(--paper-2)}
.tag.y{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 45%,transparent)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.listfoot{padding:10px 14px;text-align:center;border-top:1px solid var(--line);color:var(--muted);font-size:12px}

/* ---------- detail ---------- */
.detail{position:sticky;top:80px}
.dbody{padding:22px 26px 28px}
.dtitle{font-family:var(--serif);font-size:26px;line-height:1.35;letter-spacing:.03em;margin:0 0 10px}
.dmeta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.poem{font-family:var(--serif);font-size:19px;line-height:2.5;letter-spacing:.14em;white-space:pre-wrap;
  background:linear-gradient(var(--paper-2),var(--paper-2));border:1px solid var(--line);border-radius:12px;padding:20px 22px;position:relative}
.poem .ln{display:block;text-indent:0}
.poem .ln.alt{text-indent:2em}
/* 堅排（直排）古籍阅读 */
.poem.vertical{writing-mode:vertical-rl;text-orientation:mixed;white-space:pre-wrap;
  height:78vh;max-height:860px;overflow:auto;line-height:2.1;letter-spacing:.22em;
  padding:26px 20px;font-size:20px}
.poem.vertical .ln{display:block;text-indent:0;margin:0 2px}
.poem.vertical .ln.alt{text-indent:0}
/* 注音／異體括注：ruby 附注於字上或字側，不攪動行距與複製文本 */
.rb{ruby-position:over;ruby-align:center}
.rb rt{font-family:var(--sans);font-size:.42em;font-weight:400;letter-spacing:0;color:var(--muted);line-height:1.15}
.dtitle .rb rt{font-size:.36em}
.poem .rb rt{font-size:.4em}
.poem.vertical .rb rt{font-size:.42em}
[data-theme="dark"] .rb rt{color:var(--ink-2)}
.sec{margin-top:20px}
.sec h3{font-size:12px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;margin:0 0 8px;font-weight:600}
.kv{display:grid;grid-template-columns:78px 1fr;gap:6px 12px;font-size:13px;color:var(--ink-2)}
.kv dt{color:var(--muted)}
.kv dd{margin:0;word-break:break-all}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px;padding-top:16px;border-top:1px dashed var(--line-2)}

/* ---------- stats ---------- */
.stats{display:none;padding:16px 20px;border-top:1px solid var(--line)}
.stats.on{display:block}
.hist{display:flex;align-items:flex-end;gap:2px;height:120px;margin-top:10px}
.hbar{flex:1;background:var(--line-2);border-radius:2px 2px 0 0;min-height:2px;cursor:pointer;position:relative;transition:.12s}
.hbar:hover{background:var(--gold)}
.hbar.on{background:var(--verm)}
.hbar span{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%) rotate(0);font-size:11px;color:var(--ink-2);white-space:nowrap}
.hist-wrap{padding-bottom:24px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.statgrid{display:flex;gap:24px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);padding:14px 2px 2px}
.statgrid b{color:var(--ink);font-size:18px;font-family:var(--serif)}

/* ---------- 数据分析 ---------- */
.atabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.atab{padding:6px 16px;border-radius:20px;border:1px solid var(--line-2);background:var(--card);cursor:pointer;font-size:13px;color:var(--ink-2);transition:.12s}
.atab:hover{border-color:var(--gold);color:var(--ink)}
.atab.on{background:var(--verm);border-color:var(--verm);color:#fff}
.aqln{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.aqln input{flex:1 1 240px;min-width:220px;border:1px solid var(--line-2);border-radius:9px;background:var(--card);padding:8px 12px;font-size:15px;outline:0;color:inherit}
.aqln input:focus-visible{border-color:var(--gold);box-shadow:0 0 0 3px var(--focus)}
.acards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0 4px}
.acard{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--paper-2)}
.acard .lb{font-size:12px;color:var(--muted)}
.acard .va{font-size:22px;font-family:var(--serif);color:var(--ink);margin-top:2px}
.acard .va small{font-size:12px;color:var(--ink-2);font-family:var(--sans)}
.asub{margin-top:16px}
.asub h4{font-size:12px;letter-spacing:.12em;color:var(--muted);margin:0 0 8px;font-weight:600}
.bars{display:flex;align-items:flex-end;gap:6px;height:96px}
.bar{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px}
.bar .b{width:100%;max-width:58px;border-radius:4px 4px 0 0;background:var(--gold);opacity:.85}
.bar .b.on{background:var(--verm)}
.bar .lab{font-size:11px;color:var(--ink-2);white-space:nowrap}
.bar .n{font-size:11px;color:var(--muted)}
.chipsline{display:flex;gap:8px;flex-wrap:wrap}
.chip2{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px;font-family:var(--serif);transition:.12s}
.chip2:hover{border-color:var(--gold)}
.arankbox{max-height:56vh;overflow:auto;border:1px solid var(--line);border-radius:10px}
.atable{width:100%;border-collapse:collapse;font-size:13px}
.atable th,.atable td{padding:6px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.atable th:first-child,.atable td:first-child{text-align:left;font-family:var(--serif)}
.atable th{color:var(--muted);font-weight:600;cursor:pointer;position:sticky;top:0;background:var(--card);z-index:2;user-select:none}
.atable th:hover{color:var(--ink)}
.atable th .dot{color:var(--verm)}
.atable tbody tr{cursor:pointer}
.atable tbody tr:hover{background:var(--paper-2)}
.atable .term{font-family:var(--serif);font-size:14.5px;color:var(--ink)}
.atable .numb{font-variant-numeric:tabular-nums;color:var(--ink-2)}
.atagch{display:inline-flex;align-items:center;gap:10px;margin-top:8px;color:var(--muted);font-size:12px}
.atagch b{color:var(--verm);cursor:pointer;font-weight:600}

/* ---------- misc ---------- */
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);
  padding:9px 16px;border-radius:9px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:60}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
kbd{border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:11px;color:var(--ink-2);background:var(--paper-2)}
footer{border-top:1px solid var(--line);padding:18px 0 40px;color:var(--muted);font-size:12px}
.fnote{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="bar">
      <div class="brand">
        <span class="seal">乾</span>
        <a href="#q=" style="display:flex;align-items:baseline;gap:10px;color:inherit;text-decoration:none" title="回到首頁">
          <h1>乾隆御製詩</h1>
          <small>全文檢索 · <span id="brandCount">—</span> 首</small>
        </a>
      </div>
      <div class="searchbox">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <label class="sr" for="q">檢索</label>
        <input id="q" type="search" placeholder="檢索詩題或詩句（繁簡互通、模糊查找）…" autocomplete="off" spellcheck="false">
        <kbd>/</kbd>
      </div>
      <div class="tools">
        <button class="btn ghost" id="pyBtn" title="漢語拼音注音（詩題與詩句）" aria-pressed="false">拼音</button>
        <button class="btn ghost" id="statsBtn" title="統計">統計</button>
        <button class="btn ghost" id="anBtn" title="數據分析（字詞頻率／排行）">分析</button>
        <button class="btn ghost" id="themeBtn" title="深色模式" aria-label="深色模式">◐</button>
      </div>
    </div>
    <div class="filters">
      <div class="fgroup"><label>範圍</label>
        <select id="scope">
          <option value="all">綜合（詩題×3＋詩句）</option>
          <option value="title">僅詩題</option>
          <option value="content">僅詩句</option>
          <option value="year">僅年份／紀年</option>
          <option value="regex">正則</option>
        </select>
      </div>
      <div class="fgroup"><label>模糊</label>
        <select id="fuzzy">
          <option value="1">模糊查找</option>
          <option value="0">精確匹配</option>
        </select>
      </div>
      <div class="fgroup"><label>年份</label>
        <input class="yr" id="yFrom" type="number" placeholder="起" min="1736" max="1799">
        <span style="color:var(--muted)">–</span>
        <input class="yr" id="yTo" type="number" placeholder="止" min="1736" max="1799">
      </div>
      <div class="fgroup"><label>排序</label>
        <select id="sort">
          <option value="rel">相關度</option>
          <option value="yeara">年份 ↑</option>
          <option value="yeard">年份 ↓</option>
          <option value="len">篇幅 ↓</option>
          <option value="title">詩題</option>
        </select>
      </div>
      <div class="fgroup"><label>語言</label>
        <select id="lang">
          <option value="Hant">繁體</option>
          <option value="Hans">简体</option>
        </select>
      </div>
      <div class="chips" id="quick"></div>
      <div class="fspacer"></div>
      <div class="faction">
        <button class="btn ghost" id="favBtn" title="只看收藏">☆ 收藏</button>
        <button class="btn ghost" id="randBtn">隨機</button>
        <button class="btn ghost" id="dayBtn">每日一詩</button>
        <button class="btn ghost" id="resetBtn">重置</button>
      </div>
    </div>
  </div>
</header>

<div class="wrap">
  <section class="panel stats" id="stats" style="margin-top:16px">
    <div class="statgrid" id="statGrid"></div>
    <div class="legend" style="margin-top:0"><span>年份分佈（點擊柱條可篩選）</span><span id="histNote"></span></div>
    <div class="hist-wrap"><div class="hist" id="hist"></div></div>
    <div class="legend" id="legend"></div>
  </section>

  <section class="panel stats" id="apanel" style="margin-top:16px" aria-label="數據分析">
    <div style="padding:16px 20px">
      <div class="atabs" role="tablist" aria-label="分析視圖">
        <button class="atab on" data-atab="query" role="tab" aria-selected="true">查字·詞</button>
        <button class="atab" data-atab="rank" role="tab" aria-selected="false">全庫排行</button>
        <button class="atab" data-atab="poem" role="tab" aria-selected="false">本篇分析</button>
      </div>
      <div class="hint" id="anote" style="margin-bottom:10px"></div>
      <div id="aq">
        <div class="aqln">
          <label class="sr" for="aqInput">輸入字或詞</label>
          <input id="aqInput" type="text" placeholder="輸入某個字或詞，一鍵統計（如：春、天、高樓）…" autocomplete="off" spellcheck="false">
          <button class="btn primary" id="aqGo">統計</button>
          <button class="btn ghost" id="aqClear">清空</button>
          <span class="hint" id="aqNote"></span>
        </div>
        <div id="aqResult"></div>
      </div>
      <div id="ar" style="display:none">
        <div class="aqln">
          <div class="fgroup"><label>單位</label>
            <select id="arUnit">
              <option value="c">單字</option>
              <option value="w">二字詞</option>
            </select>
          </div>
          <div class="fgroup"><label>顯示</label>
            <select id="arLimit">
              <option value="100">前 100</option>
              <option value="300" selected>前 300</option>
              <option value="1000">前 1000</option>
            </select>
          </div>
          <span class="hint">點表頭切換排序 · 按行可轉查該字詞</span>
        </div>
        <div class="arankbox"><table class="atable" id="arTable" aria-label="字詞頻率排行">
          <thead><tr>
            <th data-k="term">字 / 詞<span class="dot"></span></th>
            <th data-k="poems">出現詩數<span style="color:var(--verm)">↓</span></th>
            <th data-k="ratio">佔全庫比<span></span></th>
            <th data-k="total" class="numb">總次數<span></span></th>
            <th data-k="avg" class="numb">平均每詩<span></span></th>
          </tr></thead>
          <tbody id="arBody"></tbody>
        </table></div>
      </div>
      <div id="ap" style="display:none"></div>
    </div>
  </section>

  <main>
    <section class="panel panel-list">
      <div class="listhead">
        <div class="count" id="count" aria-live="polite">—</div>
        <div class="hint" id="modeHint"></div>
      </div>
      <div class="list virtual" id="list" role="listbox" aria-label="檢索結果">
        <div class="vpad" id="vpad"><div class="vwin" id="vwin"></div></div>
      </div>
      <div class="listfoot" id="more"></div>
    </section>
    <section class="panel detail" id="detail"></section>
  </main>
  <footer>
    <div class="fnote">
      <span>資料版本 <b id="ver">—</b></span>
      <span>建置 <span id="built">—</span></span>
      <span>語料：欽定四庫全書《御製詩集》等公開文本</span>
      <span class="fspacer"></span>
      <button class="btn ghost" id="expBtn">匯出檢索結果</button>
      <button class="btn ghost" id="impBtn">匯入</button>
      <input id="impFile" type="file" accept=".json,application/json" style="display:none">
      <button class="btn ghost" id="expAllBtn">匯出全庫</button>
    </div>
  </footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script id="DB" type="application/json">/*__DB__*/</script>

<script>
(function(){
'use strict';
const META={version:"__VERSION__",built:"__BUILT__",count:__COUNT__};
/* ---------- 异体字表（异体 → 标准简体），供简体显示与检索折字 ---------- */
const VAR=new Map();
(function(){
  let pairs=[];try{pairs=JSON.parse(document.getElementById('VAR').textContent||'[]');}catch(e){pairs=[];}
  for(const p of pairs)if(p&&p.length===2)VAR.set(p[0],p[1]);
})();

/* ---------- 繁简折叠表（T→S），以码点对数组载入，避免代理对被截断 ---------- */
const FOLD=new Map();
(function(){
  let pairs=[];try{pairs=JSON.parse(document.getElementById('FOLD').textContent||'[]');}catch(e){pairs=[];}
  for(const p of pairs)if(p&&p.length===2)FOLD.set(p[0],p[1]);
})();
function foldOne(ch){const v=VAR.get(ch);return v?(FOLD.get(v)||v):(FOLD.get(ch)||ch);}
function fold(str){let o='';for(const ch of str)o+=foldOne(ch);return o;}

/* ---------- 界面语言：全文繁→简显示转换 ---------- */
const KEEP_TS=new Set(['乾','著','於']);   // 乾隆／書著／姓於 等
function t2s(str){
  if(!str)return str;
  let o='';const L=str.length;
  for(let i=0;i<L;i++){const c=str[i];
    if(KEEP_TS.has(c)){o+=c;continue;}
    o+=FOLD.get(c)||c;}
  return o;
}
function T(s){return state.lang==='Hans'?t2s(s):s;}

/* ---------- 逐字渲染：繁简转换、异体括注、拼音注音 ---------- */
/* 拼音：逐字取音。pinyin-pro 未收录的生僻异体常原样回显，此时改标其正字之音。 */
function pyOf(text){
  if(!state.pinyin||!window.pinyinPro)return null;
  try{
    const chars=[...text];
    const a=window.pinyinPro.pinyin(text,{type:'array',toneType:'symbol'});
    if(!a||a.length!==chars.length)return null;
    const one=s=>{try{const b=window.pinyinPro.pinyin(s,{type:'array',toneType:'symbol'});return (b&&b[0]&&b[0]!==s)?b[0]:'';}catch(e){return '';}};
    return a.map((p,i)=>{
      const ch=chars[i];
      if(p&&p!==ch)return p;
      const alt=VAR.get(ch)||foldOne(ch);
      return alt===ch?'':one(alt);
    });
  }catch(e){return null;}
}
/* 供复制/导出：简体态下按显示规则折字（异体→标准简体，繁→简） */
function plainText(str){
  if(state.lang!=='Hans')return str;
  let o='';for(const ch of str)o+=(KEEP_TS.has(ch)?ch:foldOne(ch));
  return o;
}
/* 单字 → HTML：简体态下异体字折为标准简体；注明 annotate 时以括注回标异体原文 */
function charHTML(ch,py,annotate){
  const hans=state.lang==='Hans';
  const v=hans?VAR.get(ch):null;
  const base=hans?(v||(KEEP_TS.has(ch)?ch:foldOne(ch))):ch;
  let rt=py||'';
  if(v&&annotate)rt=(rt?rt+' ':'')+'（'+ch+'）';
  if(!rt)return esc(base);
  return '<ruby class="rb">'+esc(base)+'<rt>'+esc(rt)+'</rt></ruby>';
}
function charRun(src,hits,py,annotate){
  let html='',open=false,off=0,i=0;
  for(const ch of src){
    let on=false;
    if(hits)for(let k=off;k<off+ch.length;k++)if(hits.has(k)){on=true;break;}
    if(on&&!open){html+='<mark>';open=true;}else if(!on&&open){html+='</mark>';open=false;}
    html+=charHTML(ch,py?py[i]:null,annotate);
    off+=ch.length;i++;
  }
  if(open)html+='</mark>';
  return html;
}
/* 命中位置（返回源串下标集合；正则以原文匹配，其余繁简折叠后匹配） */
function hitsOfText(src){
  const raw=state.q.trim();
  if(!raw)return null;
  if(state.scope==='regex'){
    let re;try{re=new RegExp(raw,'gu');}catch(e){return null;}
    const hits=new Set();let m;
    while((m=re.exec(src))){for(let k=m.index;k<m.index+m[0].length;k++)hits.add(k);if(!m[0])re.lastIndex++;}
    return hits.size?hits:null;
  }
  const q=fkey(raw);if(!q)return null;
  const map=[];let ff='';
  for(let i=0;i<src.length;i++)for(const c of foldOne(src[i]).toLowerCase()){ff+=c;map.push(i);}
  const hits=new Set();
  if(state.fuzzy){const r=subseq(ff,q);if(r)r.hits.forEach(i=>hits.add(map[i]));}
  else{let i=0;while((i=ff.indexOf(q,i))>=0){for(let k=i;k<i+q.length;k++)hits.add(map[k]);i+=q.length;}}
  return hits.size?hits:null;
}

/* 动态渲染区 */
const DYN_IDS=['list','detail','hist','more','count','modeHint','histNote','legend','toast'];
function normLang(v){return v==='Hans'?'Hans':'Hant';}
function localize(el){
  if(el&&state.lang==='Hans'){
    const tw=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null);
    const ns=[];let n;while(n=tw.nextNode())ns.push(n);
    for(const t of ns){const v=t2s(t.nodeValue);if(t.nodeValue!==v)t.nodeValue=v;}
  }
}
/* 静态界面文字：load 时抓取繁体快照，切换时重放 */
const STATIC_SNAP=[];
function snapStatic(root){
  if(STATIC_SNAP.length)return;
  const tw=document.createTreeWalker(root||document.body,NodeFilter.SHOW_TEXT,null);
  const ns=[];let n;while(n=tw.nextNode())ns.push(n);
  for(const t of ns){
    if(!t.nodeValue||!t.nodeValue.trim())continue;
    const p=t.parentElement;
    if(!p||p.closest('script')||p.closest('style'))continue;
    if(p.closest('#'+DYN_IDS.join(',#')))continue;
    STATIC_SNAP.push({t,hant:t.nodeValue});
  }
}
function applyStatic(){
  for(const e of STATIC_SNAP)e.t.nodeValue=state.lang==='Hans'?t2s(e.hant):e.hant;
}
function applyLang(){
  document.documentElement.lang=state.lang==='Hans'?'zh-Hans':'zh-Hant';
  applyStatic();
  elLang.value=state.lang;
  renderAll(true);
  store('ql_lang',state.lang);
  syncHash();
  if(document.getElementById('apanel')&&$('#apanel').classList.contains('on'))renderAnalysisTab();
}

/* ---------- 数据装载 ---------- */
let BASE=JSON.parse(document.getElementById('DB').textContent||'{"poems":[]}').poems||[];
let CUSTOM=[];
try{CUSTOM=JSON.parse(localStorage.getItem('ql_custom')||'[]');}catch(e){CUSTOM=[];}
let FAV=new Set();try{FAV=new Set(JSON.parse(localStorage.getItem('ql_fav')||'[]'));}catch(e){}

const SRC=()=>BASE.concat(CUSTOM);
const PUNCT=/[\s\u3000，。、；：？！「」『』（）《》〈〉“”‘’·—…．,.;:?!"'()\[\]{}<>\/\\|~`^\-_+=*&%$#@]/g;
function fkey(s){return fold(s).replace(PUNCT,'').toLowerCase();}

function foldInfo(p,field){
  const key=field==='t'?'_ft':'_fc';
  if(p[key])return p[key];
  const src=p[field]||'';let f='';const map=[];
  for(let i=0;i<src.length;i++){const ch=src[i];const fo=foldOne(ch).toLowerCase();
    for(const c of fo){f+=c;map.push(i);}}
  p[key]={f,map};
  return p[key];
}

/* ---------- 表单要素 ---------- */
const $=(s)=>document.querySelector(s);
const elQ=$('#q'),elScope=$('#scope'),elFuzzy=$('#fuzzy'),elYF=$('#yFrom'),elYT=$('#yTo'),elSort=$('#sort'),elLang=$('#lang'),elPy=$('#pyBtn');
const elList=$('#list'),elVpad=$('#vpad'),elVwin=$('#vwin'),elCount=$('#count'),elMore=$('#more'),elDetail=$('#detail'),elHint=$('#modeHint');
const elStats=$('#stats'),elHist=$('#hist'),elToast=$('#toast');

const state={q:'',scope:'all',fuzzy:true,yf:null,yt:null,sort:'rel',favOnly:false,sel:null,histYear:null,lang:'Hant',vertical:false,pinyin:false};
let lastResults=[],lastScored=[];
const ROW_H=118;

/* ---------- 检索 ---------- */
function subseq(text,q){
  let ti=0,gaps=0,hits=[];
  for(let i=0;i<text.length&&ti<q.length;i++){
    if(text[i]===q[ti]){hits.push(i);ti++;}else if(ti>0)gaps++;
  }
  return ti===q.length?{hits,gaps}:null;
}
function scoreOne(text,q,fuzzy){
  if(!q)return 0;
  const idx=text.indexOf(q);
  if(idx>=0)return 1000-Math.min(idx,300);
  if(!fuzzy)return -1;
  const r=subseq(text,q);
  if(!r)return -1;
  return Math.max(1,400-r.gaps-r.hits[0]);
}
function yearMatch(p,q){
  const t=(p.yt||'')+' '+p.y+' '+((p.gz||[]).join(''));
  return fkey(t).indexOf(q)>=0;
}
function search(){
  const raw=state.q.trim();
  const q=(state.scope==='regex'?raw:fkey(raw));
  let re=null;
  if(state.scope==='regex'&&raw){try{re=new RegExp(raw,'u');}catch(e){re=null;}}
  const out=[];
  for(const p of SRC()){
    if(state.favOnly&&!FAV.has(p.id))continue;
    if(state.yf!=null||state.yt!=null){
      if(!p.y)continue;
      if(state.yf!=null&&p.y<state.yf)continue;
      if(state.yt!=null&&p.y>state.yt)continue;
    }
    if(state.histYear!=null&&p.y!==state.histYear)continue;
    let sc=0;
    if(raw){
      if(state.scope==='regex'){
        if(!re)continue;
        const ok=re.test(p.t)||re.test(p.c)||re.test(p.yt||'')||re.test(String(p.y));
        if(!ok)continue;
        sc=1;
      }else if(state.scope==='year'){
        if(!yearMatch(p,q))continue;
        sc=1;
      }else{
        const ft=foldInfo(p,'t').f, fc=foldInfo(p,'c').f;
        if(state.scope==='title'){sc=scoreOne(ft,q,state.fuzzy);}
        else if(state.scope==='content'){sc=scoreOne(fc,q,state.fuzzy);}
        else{const a=scoreOne(ft,q,state.fuzzy),b=scoreOne(fc,q,state.fuzzy);
          sc=(a>0?a*3:0)+(b>0?b:0);if(a<0&&b<0)sc=-1;}
        if(sc<0)continue;
        if(sc===0&&!q)sc=1;
      }
    }
    out.push({p,sc});
  }
  const cmp={
    rel:(a,b)=>(b.sc-a.sc)||((a.p.y||9999)-(b.p.y||9999)),
    yeara:(a,b)=>((a.p.y||9999)-(b.p.y||9999))||(b.sc-a.sc),
    yeard:(a,b)=>((b.p.y||0)-(a.p.y||0))||(b.sc-a.sc),
    len:(a,b)=>(b.p.c.length-a.p.c.length),
    title:(a,b)=>(a.p.t||'').localeCompare(b.p.t||'','zh')
  }[state.sort];
  out.sort(cmp);
  lastScored=out;lastResults=out.map(o=>o.p);
}

/* ---------- 高亮（逐字渲染器之上） ---------- */
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function hl(p,field){const src=p[field]||'';return charRun(src,hitsOfText(src),null,false);}
function hlSeg(seg){return charRun(seg,hitsOfText(seg),null,false);}

function meterOf(n){
  if(n>=20){for(const m of [7,5,4,6])if(n%m===0)return m;}
  return 0;
}
function layout(content){
  const n=content.length,m=meterOf(n);
  if(!m)return [{t:content,alt:false}];
  const rows=[];
  for(let i=0;i<n;i+=m)rows.push({t:content.slice(i,i+m),alt:false});
  rows.forEach((r,i)=>{r.alt=(i%2===1);});
  return rows;
}
function snippet2(p){
  const plain=p.c||'';
  const raw=state.q.trim();
  const q=raw?fkey(raw):'';
  const head=(s)=>({html:charRun(s,null,null,false)+(plain.length>s.length?'…':'')});
  if(!raw||state.scope==='regex'||state.scope==='year')return head(plain.slice(0,40));
  const {f,map}=foldInfo(p,'c');
  let start=-1;
  if(q){const idx=f.indexOf(q);if(idx>=0)start=map[idx];}
  if(start<0&&state.fuzzy&&q){const r=subseq(f,q);if(r)start=map[r.hits[0]];}
  if(start<0)return head(plain.slice(0,40));
  const a=Math.max(0,start-12),b=Math.min(plain.length,start+60),seg=plain.slice(a,b);
  return {html:(a>0?'…':'')+hlSeg(seg)+(b<plain.length?'…':'')};
}

/* ---------- 列表窗口化渲染（固定行高，仅渲染可见行） ---------- */
function itemHTML(p){
  const sn=snippet2(p);
  const y=p.y?p.y:'—';
  return '<div class="item'+(state.sel===p.id?' on':'')+'" data-id="'+p.id+'" role="option" aria-selected="'+(state.sel===p.id)+'" tabindex="0">'+
    '<div class="t">'+hl(p,'t')+'</div>'+
    '<div class="s">'+sn.html+'</div>'+
    '<div class="m"><span class="tag y">'+y+'</span>'+
    (p.ji?'<span class="tag">'+esc(T(p.ji))+(p.j?('卷'+p.j):'')+'</span>':'')+
    (p.sr?'<span class="tag">'+esc(T('組詩'))+'</span>':'')+
    (p.tg&&p.tg.length?'<span class="tag">'+esc(T(p.tg[0]))+'</span>':'')+
    (FAV.has(p.id)?'<span class="tag">★</span>':'')+'</div></div>';
}
let vTimer=null;
function renderWindow(){
  const total=lastResults.length;
  if(!total){elVpad.style.height='0px';elVwin.innerHTML='';return;}
  const scrollTop=elList.scrollTop, viewH=elList.clientHeight||elList.offsetHeight;
  const buf=Math.ceil((viewH/ROW_H))+3;               // 上缓冲若干行
  let start=Math.floor(scrollTop/ROW_H)-buf;
  let end=Math.ceil((scrollTop+viewH)/ROW_H)+buf+1;
  if(start<0)start=0;if(end>total)end=total;
  elVpad.style.height=(total*ROW_H)+'px';
  let html='';
  for(let i=start;i<end;i++)html+=itemHTML(lastResults[i]);
  elVwin.style.transform='translateY('+(start*ROW_H)+'px)';
  elVwin.innerHTML=html;
}
function renderList(){
  const total=lastResults.length;
  elCount.innerHTML=T('共')+' <b>'+total+'</b> '+T('篇');
  if(!total){
    elVwin.innerHTML='<div class="empty">'+T('沒有符合條件的篇目')+'<br><span class="hint">'+T('可嘗試開啟「模糊查找」或放寬年份範圍')+'</span></div>';
    elVpad.style.height='auto';
    elMore.innerHTML=T('共')+' <b>0</b> '+T('篇');
    elHint.textContent='';
    return;
  }
  elMore.innerHTML=T('已顯示前')+' <b>'+Math.min(total,500)+'</b> ／'+T('共')+' <b>'+total+'</b> '+T('篇 · 請在列表中捲動查看更多');
  elHint.textContent=state.q.trim()?(T(state.fuzzy?'模糊':'精確')+'·'+T({all:'綜合',title:'詩題',content:'詩句',year:'年份',regex:'正則'}[state.scope])):'';
  elList.scrollTop=elList.scrollTop||0;
  renderWindow();
}

/* ---------- 详情渲染 ---------- */
function renderDetail(){
  const p=SRC().find(x=>x.id===state.sel);
  if(!p){elDetail.innerHTML='<div class="empty" style="padding:80px 20px">'+T('從左側選擇一篇以查看全文')+'<div class="hint" style="margin-top:10px">'+T('或按')+' <kbd>R</kbd> '+T('隨機、')+'<kbd>D</kbd> '+T('每日一詩')+'</div></div>';return;}
  const rows=layout(p.c);
  const bodyHtml=rows.map(r=>'<span class="ln'+(r.alt?' alt':'')+'">'+charRun(r.t,hitsOfText(r.t),pyOf(r.t),true)+'</span>').join('');
  const gz=(p.gz&&p.gz.length)?p.gz.join('、'):'—';
  const prov=p.prov||{};
  elDetail.innerHTML='<div class="dbody">'+
    '<h2 class="dtitle">'+charRun(p.t,hitsOfText(p.t),pyOf(p.t),true)+'</h2>'+
    '<div class="dmeta">'+
      '<span class="tag y">'+(p.y||T('年份未詳'))+'</span>'+
      (p.ji?'<span class="tag">'+esc(T(p.ji))+(p.j?('·卷'+p.j):'')+'</span>':'')+
      '<span class="tag">'+p.c.length+' '+T('字')+'</span>'+
      (meterOf(p.c.length)?'<span class="tag">'+meterOf(p.c.length)+T('言')+'</span>':'')+
      (p.tg||[]).map(t=>'<span class="tag">'+esc(T(t))+'</span>').join('')+
    '</div>'+
    '<div class="poem'+(state.vertical?' vertical':'')+'" id="poemBody">'+bodyHtml+'</div>'+
    (p.nt?'<div class="sec"><h3>'+T('題解／小序')+'</h3><div style="color:var(--ink-2)">'+esc(T(p.nt))+'</div></div>':'')+
    '<div class="sec"><h3>'+T('著錄')+'</h3><dl class="kv">'+
      '<dt>'+T('紀年')+'</dt><dd>'+esc(T(p.yt||'—'))+'（'+T('干支')+' '+esc(T(gz))+'）</dd>'+
      (p.sr?'<dt>'+T('組詩')+'</dt><dd>'+esc(T(p.sr))+'</dd>':'')+
      '<dt>'+T('出處')+'</dt><dd>'+esc(T(prov.source_of_record||p.src||'—'))+'</dd>'+
      (prov.url?'<dt>'+T('原文')+'</dt><dd><a href="'+esc(prov.url)+'" target="_blank" rel="noopener">'+esc(prov.url)+'</a></dd>':'')+
      (prov.retrieved?'<dt>'+T('核校')+'</dt><dd>'+esc(prov.retrieved)+'</dd>':'')+
    '</dl></div>'+
    '<div class="acts">'+
      '<button class="btn" id="vBtn" title="'+T('橫排／直排')+'">'+T(state.vertical?'橫排':'堅排')+'</button>'+
      '<button class="btn primary" id="copyBtn">'+T('複製詩文')+'</button>'+
      '<button class="btn" id="anaBtn">'+T('分析本篇')+'</button>'+
      '<button class="btn" id="favTog">'+(FAV.has(p.id)?'★ '+T('已收藏'):'☆ '+T('收藏'))+'</button>'+
      '<button class="btn" id="linkBtn">'+T('複製連結')+'</button>'+
      '<button class="btn ghost" id="prevBtn">'+T('上一篇')+'</button>'+
      '<button class="btn ghost" id="nextBtn">'+T('下一篇')+'</button>'+
    '</div></div>';
}

/* ---------- 综合刷新 ---------- */
function localizeDynamic(){
  localize(elMore);localize(elCount);localize(elHint);
  localize($('#histNote'));localize($('#legend'));localize($('#statGrid'));
}
function renderAll(reset){
  if(reset&&lastResults.length)elList.scrollTop=0;
  if(reset)state.page=1;
  search();
  renderList();
  if(!lastResults.find(p=>p.id===state.sel))state.sel=lastResults.length?lastResults[0].id:null;
  else if(reset&&lastResults.length)state.sel=lastResults[0].id;
  if(reset&&lastResults.length)selectPoemSilent(state.sel);
  else renderDetail();
  renderHist();
  localizeDynamic();
  syncHash();
}

/* ---------- 年份统计 ---------- */
let YEARBINS=[];
function computeBins(){
  const m=new Map();
  for(const p of SRC()){if(p.y)m.set(p.y,(m.get(p.y)||0)+1);}
  YEARBINS=[...m.entries()].sort((a,b)=>a[0]-b[0]);
}
function renderHist(){
  if(!YEARBINS.length)return;
  const max=Math.max(...YEARBINS.map(b=>b[1]));
  elHist.innerHTML=YEARBINS.map(([y,n])=>
    '<div class="hbar'+(state.histYear===y?' on':'')+'" data-y="'+y+'" style="height:'+Math.max(2,n/max*100)+'%" title="'+y+' 年 · '+n+' 首"></div>').join('');
  const step=YEARBINS.length>14?10:5;
  elHist.querySelectorAll('.hbar').forEach((b,i)=>{if(i%step===0){const s=document.createElement('span');s.textContent=b.dataset.y;b.appendChild(s);}});
  const total=SRC().length, withY=SRC().filter(p=>p.y).length;
  $('#histNote').textContent='近 '+YEARBINS.length+' 個年份有繫年 · 已繫年 '+withY+'/'+total;
  const byJi={};SRC().forEach(p=>{const k=p.ji||'未分集';byJi[k]=(byJi[k]||0)+1;});
  $('#legend').innerHTML=Object.entries(byJi).sort().map(([k,v])=>'<span>'+esc(k)+'：'+v+' 首</span>').join('');
  $('#statGrid').innerHTML='<span>全庫 <b>'+SRC().length+'</b> 首</span>'+
    '<span>已繫年 <b>'+withY+'</b></span>'+
    '<span>年份 <b>'+YEARBINS[0][0]+'–'+YEARBINS[YEARBINS.length-1][0]+'</b></span>';
}

/* ---------- 导出 / 导入 ---------- */
function download(name,text){
  const b=new Blob([text],{type:'application/json;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function toast(msg){elToast.textContent=(state.lang==='Hans'?t2s(msg):msg);elToast.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>elToast.classList.remove('on'),1800);}
function exportOne(p){

async function copyText(t){
  try{ if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(t); return true; } }catch(e){}
  try{
    const ta=document.createElement('textarea');ta.value=t;
    ta.style.cssText='position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta);ta.focus();ta.select();
    const ok=document.execCommand('copy');ta.remove();return ok;
  }catch(e){ return false; }
}
function store(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

function syncHash(){
  const h=new URLSearchParams();
  if(state.q)h.set('q',state.q);
  if(state.scope!=='all')h.set('s',state.scope);
  if(!state.fuzzy)h.set('f','0');
  if(state.yf!=null)h.set('yf',state.yf);
  if(state.yt!=null)h.set('yt',state.yt);
  if(state.sort!=='rel')h.set('sort',state.sort);
  if(state.histYear!=null)h.set('hy',state.histYear);
  if(state.lang!=='Hant')h.set('l',state.lang);
  if(state.vertical)h.set('v','1');
  if(state.pinyin)h.set('py','1');
  if(state.sel)h.set('id',state.sel);
  const s=h.toString();
  try{ history.replaceState(null,'',s?('#'+s):location.pathname); }catch(e){}
}
function readHash(){
  const h=new URLSearchParams(location.hash.slice(1));
  if(h.has('q'))state.q=h.get('q');
  if(h.has('s'))state.scope=h.get('s');
  if(h.has('f'))state.fuzzy=h.get('f')!=='0';
  if(h.has('yf'))state.yf=+h.get('yf');
  if(h.has('yt'))state.yt=+h.get('yt');
  if(h.has('sort'))state.sort=h.get('sort');
  if(h.has('hy'))state.histYear=+h.get('hy');
  if(h.has('l'))state.lang=normLang(h.get('l'));
  if(h.has('v'))state.vertical=h.get('v')==='1';
  if(h.has('py'))state.pinyin=h.get('py')==='1';
  if(h.has('id'))state.sel=h.get('id');
  elQ.value=state.q;elScope.value=state.scope;elFuzzy.value=state.fuzzy?'1':'0';
  elYF.value=state.yf??'';elYT.value=state.yt??'';elSort.value=state.sort;
}

document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT'){if(e.key==='Escape'){e.target.blur();}return;}
  if(e.key==='/'){e.preventDefault();elQ.focus();}
  if(e.key==='r'||e.key==='R')pickRandom();
  if(e.key==='d'||e.key==='D')pickDaily();
  if(e.key==='j'||e.key==='J')stepPoem(1);
  if(e.key==='k'||e.key==='K')stepPoem(-1);
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    const dir=e.key==='ArrowDown'?1:-1;stepPoem(dir);
  }
});

/* ---------- 数据分析 ---------- */
const AF_JI=['初集','二集','三集','四集','五集','餘集','未分集'];
const AR={tab:'query',unit:'c',key:'poems',dir:-1,limit:300};
let AQ_STATE=null;                  /* 最近一次查询结果 */
let _FREQ_READY=false,_CHARS=[],_WORDS=[],_CFREQ=null,_WFREQ=null;
const CJK1=/[\u3400-\u9FFF\uF900-\uFAFF]/;
function freqTables(){
  if(_FREQ_READY)return;
  let d={chars:[],words:[]};
  try{d=JSON.parse(document.getElementById('FREQ').textContent||'{"chars":[],"words":[]}');}catch(e){}
  _CHARS=d.chars||[];_WORDS=d.words||[];
  _CFREQ=new Map(_CHARS.map(r=>[r[0],[r[1],r[2]]]));
  _WFREQ=new Map(_WORDS.map(r=>[r[0],[r[1],r[2]]]));
  _FREQ_READY=true;
}
function acard(lb,val,sub){return '<div class="acard"><div class="lb">'+esc(lb)+'</div><div class="va">'+esc(String(val))+(sub?'<small> '+esc(String(sub))+'</small>':'')+'</div></div>';}
function aCount(f,q){let n=0,i=0;while((i=f.indexOf(q,i))>=0){n++;i+=q.length;}return n;}
/* 某字/词：出现的诗数 + 总次数 + 集别分布（与检索同源折叠，繁/简/异体一致） */
function aAnalyze(raw){
  const q=fkey(raw);
  if(!q)return null;
  let poems=0,total=0;const byJi={};
  for(const p of SRC()){
    const ft=foldInfo(p,'t').f,fc=foldInfo(p,'c').f;
    const ni=ft.indexOf(q),nj=fc.indexOf(q);
    if(ni<0&&nj<0)continue;
    total+=(ni>=0?aCount(ft,q):0)+(nj>=0?aCount(fc,q):0);
    poems++;const k=p.ji||'未分集';byJi[k]=(byJi[k]||0)+1;
  }
  return {raw,q,poems,total,byJi};
}
function aSet(raw){$('#aqInput').value=raw;AQ_STATE=aAnalyze(raw);renderQuery();aqNote();}
function aqNote(){
  const n=$('#aqNote');if(!n)return;
  n.textContent=AQ_STATE?(AQ_STATE.poems?'':'· '+T('無命中：未檢得可折合的字詞')):'';
}
function renderQuery(){
  const box=$('#aqResult');
  if(!AQ_STATE){box.innerHTML='<div class="empty" style="padding:20px">'+T('輸入某個字或詞並點「統計」，即得其在全部詩中的出現詩數、總次數與分集分佈。')+'</div>';return;}
  freqTables();
  const {poems,total,byJi}=AQ_STATE;
  const denom=BASE.length;
  const cards=
    '<div class="acards">'+
    acard(T('出現詩數'),poems)+
    acard(T('佔全庫比'),(denom?(poems/denom*100).toFixed(2):'0')+'%',T('總')+' '+denom+' '+T('首'))+
    acard(T('總出現次數'),total)+
    acard(T('平均每詩'),poems?(total/poems).toFixed(2):'0')+
    '</div>';
  const vals=AF_JI.map(j=>byJi[j]||0);const max=Math.max(1,...vals);
  const bars=AF_JI.map((j,i)=>
    '<div class="bar" title="'+esc(T(j))+' · '+(vals[i]||0)+' '+T('首')+'">'+
      '<div class="n">'+(vals[i]||'')+'</div>'+
      '<div class="b" style="height:'+(vals[i]?Math.max(4,vals[i]/max*100):2)+'%"></div>'+
      '<div class="lab">'+esc(T(j))+'</div></div>').join('');
  let rel='';
  if([...AQ_STATE.q].length===1&&_WORDS.length){
    const c=[...AQ_STATE.q][0];const matches=[];
    for(const r of _WORDS){if(fkey(plainText(r[0])).indexOf(c)>=0)matches.push(r);}
    matches.sort((a,b)=>b[1]-a[1]);
    const rels=matches.slice(0,18);
    if(rels.length)rel='<div class="asub"><h4>'+T('相關二字搭配（按出現詩數）')+'</h4><div class="chipsline">'+
      rels.map(r=>'<button class="chip2" data-term="'+esc(plainText(r[0]))+'">'+esc(plainText(r[0]))+'<span class="atagch">'+r[1]+'</span></button>').join('')+'</div></div>';
  }
  box.innerHTML=cards+
    '<div class="asub"><h4>'+T('分集分佈（出現該字詞之詩數）')+'</h4><div class="bars">'+bars+'</div></div>'+
    rel;
  box.querySelectorAll('.chip2').forEach(b=>b.addEventListener('click',()=>aSet(b.dataset.term)));
}
function arVal(r,k){switch(k){
  case 'poems':return r[1];case 'total':return r[2];case 'avg':return r[2]/r[1];
  case 'ratio':return r[1]/BASE.length;case 'term':return r[0];}}
function arRows(){
  const arr=AR.unit==='c'?_CHARS:_WORDS;
  if(!arr.length)return[];
  const _a=arr.slice().sort((a,b)=>{const va=arVal(a,AR.key),vb=arVal(b,AR.key);
    if(AR.key==='term')return AR.dir<0?vb.localeCompare(va,'zh'):va.localeCompare(vb,'zh');
    return AR.dir<0?(vb-va):(va-vb);});
  return _a.slice(0,AR.limit);
}
function renderRank(){
  freqTables();
  const denom=BASE.length;
  $('#arTable thead th').forEach(th=>{const s=th.querySelector('span');
    if(s&&th.dataset.k!=='term')s.textContent=(AR.key===th.dataset.k?(AR.dir<0?'↓':'↑'):'');});
  if(!_CHARS.length){$('#arBody').innerHTML='<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:18px">'+T('無數據')+'</td></tr>';return;}
  const rows=arRows();
  $('#arBody').innerHTML=rows.map(r=>{
    const avg=r[2]/r[1];return '<tr data-term="'+esc(plainText(r[0]))+'">'+
      '<td class="term">'+esc(plainText(r[0]))+'</td>'+
      '<td class="numb">'+r[1]+'</td>'+
      '<td class="numb">'+(r[1]/denom*100).toFixed(2)+'%</td>'+
      '<td class="numb">'+r[2]+'</td>'+
      '<td class="numb">'+avg.toFixed(2)+'</td></tr>';}).join('');
  $('#arBody').querySelectorAll('tr').forEach(tr=>tr.addEventListener('click',()=>{aSet(tr.dataset.term);switchAnalysis('query');}));
  $('#anote').textContent=T('全庫字/詞頻率排行 · 單字 ')+_CHARS.length+T(' 種 · 二字詞 ')+_WORDS.length+T(' 種（詩數≥2 收錄） · 共 ')+denom+T(' 首');
  localize($('#anote'));
}
function renderPoem(){
  const all=SRC();const p=all.find(x=>x.id===state.sel)||all[0];
  if(!p){$('#ap').innerHTML='<div class="empty" style="padding:20px">'+T('暫無詩篇可供分析')+'</div>';return;}
  freqTables();
  const chars=[];for(const ch of (p.t||'')+(p.c||''))if(CJK1.test(ch))chars.push(ch);
  let cnt=new Map();for(const ch of chars)cnt.set(ch,(cnt.get(ch)||0)+1);
  const uniq=cnt.size,len=chars.length;
  const top=[...cnt.entries()].sort((a,b)=>b[1]-a[1]).slice(0,12);
  const rare=[...cnt.keys()].filter(ch=>{const e=_CFREQ.get(ch);return !e||e[0]<=3;}).slice(0,40);
  const bcnt=new Map();for(let i=0;i<chars.length-1;i++){if(CJK1.test(chars[i])&&CJK1.test(chars[i+1])){const w=chars[i]+chars[i+1];bcnt.set(w,(bcnt.get(w)||0)+1);}}
  const topw=[...bcnt.entries()].sort((a,b)=>b[1]-a[1]).slice(0,6);
  const corpusTotalChars=_CHARS.reduce((s,r)=>s+r[2],0);
  const avgLen=BASE.length?(corpusTotalChars/BASE.length):0;
  $('#ap').innerHTML=
    '<div class="acards">'+
    acard(T('全詩字數'),len)+
    acard(T('去重字種'),uniq)+
    acard(T('字種率'),uniq&&len?((uniq/len*100).toFixed(1)+'%'):'—')+
    acard(T('全庫每詩均值'),avgLen.toFixed(0),T('字'))+
    '</div>'+
    '<div class="asub"><h4>'+T('高頻字 TOP · 點可按行轉查')+'</h4><div class="chipsline">'+
      top.map(([ch,n])=>'<button class="chip2" data-term="'+esc(plainText(ch))+'">'+esc(plainText(ch))+'<span class="atagch">'+n+'</span></button>').join('')+'</div></div>'+
    (topw.length?'<div class="asub"><h4>'+T('詩中二字詞 TOP')+'</h4><div class="chipsline">'+
      topw.map(([w,n])=>'<button class="chip2" data-term="'+esc(plainText(w))+'">'+esc(plainText(w))+'<span class="atagch">'+n+'</span></button>').join('')+'</div></div>':'')+
    '<div class="asub"><h4>'+T('全庫低頻字（詩數≤3，生僻）')+'</h4><div>'+
      (rare.length?rare.map(ch=>'<button class="chip2" data-term="'+esc(plainText(ch))+'" style="font-size:12px">'+esc(plainText(ch))+'</button>').join(' '):'<span class="hint">'+T('無')+'</span>')+'</div></div>';
  $('#ap').querySelectorAll('.chip2').forEach(b=>b.addEventListener('click',()=>{aSet(b.dataset.term);switchAnalysis('query');}));
}
function switchAnalysis(tab){
  AR.tab=tab;
  $('#apanel .atab').forEach(b=>{const on=b.dataset.atab===tab;b.classList.toggle('on',on);b.setAttribute('aria-selected',on?'true':'false');});
  $('#aq').style.display=tab==='query'?'':'none';
  $('#ar').style.display=tab==='rank'?'':'none';
  $('#ap').style.display=tab==='poem'?'':'none';
  renderAnalysisTab();
}
function renderAnalysisTab(){
  if(AR.tab==='query'){if(!AQ_STATE){$('#aqResult').innerHTML='<div class="empty" style="padding:20px">'+T('輸入某個字或詞並點「統計」，即得其在全部詩中的出現詩數、總次數與分集分佈。')+'</div>';}else{renderQuery();}}
  else if(AR.tab==='rank'){renderRank();}
  else{renderPoem();}
  localize(AR.tab==='query'?$('#aqResult'):AR.tab==='rank'?$('#ar'):$('#ap'));
  localize($('#anote'));localize($('#aqNote'));
}

(function init(){
  state.reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const th=localStorage.getItem('ql_theme');if(th)document.documentElement.dataset.theme=th;
  state.lang=normLang(localStorage.getItem('ql_lang'));
  state.vertical=localStorage.getItem('ql_v')==='1';
  state.pinyin=localStorage.getItem('ql_py')==='1';
  $('#ver').textContent=META.version;$('#built').textContent=META.built;
  $('#brandCount').textContent=SRC().length;
  renderQuick();
  readHash();
  elLang.value=state.lang;
  document.documentElement.lang=state.lang==='Hans'?'zh-Hans':'zh-Hant';
  syncPyBtn();
  computeBins();
  renderAll(false);
  snapStatic();
  applyStatic();
  // 高度自适应
  window.addEventListener('resize',()=>{clearTimeout(vTimer);vTimer=setTimeout(renderWindow,60);});
})();
})();
</script>
</body>
